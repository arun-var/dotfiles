# Cross-platform tmux configuration

# Increase history limit
set-option -g history-limit 25000

# Enable mouse support
set -g mouse on

# Neovim optimizations
set -sg escape-time 10
set-option -g focus-events on

# Vi-style copy mode
setw -g mode-keys vi

# Platform-specific shell detection
if-shell "uname | grep -q Darwin" {
    # macOS specific settings
    set-option -g default-shell /bin/zsh
} {
    # Linux (Ubuntu) specific settings
    set-option -g default-shell /usr/bin/zsh
}

# Terminal color settings (compatible with both macOS and Linux)
set-option -g default-terminal "screen-256color"
set-option -sa terminal-features ',xterm-256color:RGB'

# Status bar configuration
set -g status-right "#(pomo)"
set -g status-style "fg=#665c54"
set -g status-left-style "fg=#928374"
set -g status-bg default
set -g status-position top
set -g status-interval 1
set -g status-left ""

# Automatic pane renaming
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'

# Start pane and window indexing at 1
set -g base-index 1
setw -g pane-base-index 1

# Reload configuration
bind-key -r r source-file ~/.tmux.conf

# Copy mode enhancements (works on both macOS and Linux)
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# macOS-specific clipboard support (requires reattach-to-user-namespace)
if-shell "uname | grep -q Darwin" {
    set-option -g default-command "reattach-to-user-namespace -l zsh"
}
