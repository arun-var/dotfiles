# Cross-platform Alacritty configuration

# Detect and import theme based on platform
import = [
    # Mac theme path
    "{{ env:HOME }}/.config/alacritty/themes/themes/gruvbox_dark.toml",
    # Linux theme path
    "{{ env:HOME }}/.config/alacritty/gruvbox_dark.toml"
]

[font]
# Adjust font size based on platform
size = 18

[font.normal]
# Use a Nerd Font that works well on both platforms
family = "UbuntuMono Nerd Font"

[window]
# Optional: Uncomment to remove window decorations
# decorations = "none"

[window.padding]
x = 7
y = 0

# Platform-specific shell configuration
[shell]
# Use zsh if available, otherwise fallback to default shell
program = "/usr/bin/zsh"
args = ["--login"]
